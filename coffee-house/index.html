<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Coffee House</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./src/pages/home.css">
</head>
<body>
  <div class="container header__inner">
    <header>
      <a href="#" data-page="home">
        <div class="logo">
          <div class="ellipce">
            <img src="/coffee-house/src/images/logo/Ellipse.png" alt="ellipce">
          </div>
          <div class="resource">
            <img src="/coffee-house/src/images/logo/Resource.png" alt="resource">
          </div>
          <div class="coffe-house">
            <img src="/coffee-house/src/images/logo/Coffee House.png" alt="coffe-house">
          </div>
        </div>
      </a>
      <nav>
        <ul>
          <li>
            <a href="#">Favorite coffee</a>
            <div class="line"></div>
          </li>
          <li>
            <a href="#">About</a>
            <div class="line"></div>
          </li>
          <li>
            <a href="#">Mobile app</a>
            <div class="line"></div>
          </li>
          <li>
            <a href="#">Contact us</a>
            <div class="line"></div>
          </li>
        </ul>
      </nav>
      <nav>
        <a href="#" data-page="menu" class="menu">
          <div class="menu_cup">
            Menu
            <img src="/coffee-house/src/images/icons/coffee-cup.png" alt="cup" class="coffe_cup">
          </div>
          <div class="line"></div>
        </a>
      </nav>
    </header>
    <div id="hero">
      <img src="/coffee-house/src/images/hero/container.png" alt="temp">
    </div>
  </div>
  <div class="container main">
    <main id="app"></main>
  </div>
  <div class="container footer">
    <footer>
      <img src="/coffee-house/src/images/contacts/container (4).png" alt="temp">
    </footer>
  </div>
  <script src="./index.js" type="module"></script>
</body>
</html>
